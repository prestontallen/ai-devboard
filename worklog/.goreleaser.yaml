version: 2
project_name: worklog

before:
  hooks:
    - go mod tidy
    # install.sh lives at the repo root, one level above goreleaser's workdir.
    # It is copied in rather than globbed with ../install.sh because goreleaser
    # refuses to glob outside its workdir: that pattern fails outright with
    # "stat static prefix .//<abs path>: invalid argument". The copy is
    # gitignored.
    - cp ../install.sh ./install.sh

builds:
  - id: worklog
    main: ./cmd/worklog
    binary: worklog
    env:
      - CGO_ENABLED=0
    ldflags:
      # -0- because a release IS its tag, zero commits past it. The
      # installer orders on (tag, commits-ahead), so the release needs the
      # same shape as a local build or the two cannot be compared.
      - -s -w -X main.version=v{{.Version}}-0-g{{.ShortCommit}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64

# Raw binaries with version-free names so install.sh can fetch
# releases/latest/download/worklog_<os>_<arch> without knowing the tag.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  # The bootstrap is verified like everything else it fetches. The first
  # curl of it is still trust-on-first-use, but a second run can check it.
  extra_files:
    - glob: ./install.sh

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
  # Published so the documented one-liner and the binary it installs always
  # come from the same tag:
  #   curl -fsSL .../releases/latest/download/install.sh | bash
  extra_files:
    - glob: ./install.sh
