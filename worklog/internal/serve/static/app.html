<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devboard · next</title>

<!-- The import map is load-bearing, not a convenience: the vendored
     hooks.module.js itself opens with a bare `import ... from "preact"`,
     so without this it cannot resolve. Vendor filenames and these
     specifiers move together. Application modules under /assets/src/
     import each other relatively and add no bare specifiers. -->
<script type="importmap">
{
  "imports": {
    "preact": "/assets/vendor/preact.module.js",
    "preact/hooks": "/assets/vendor/hooks.module.js",
    "htm": "/assets/vendor/htm.module.js"
  }
}
</script>

<style>
  /* Tokens are copied from index.html deliberately: adb-lens-cutover owns
     unifying them, and duplicating a dozen custom properties beats coupling
     this page to the outgoing board's stylesheet while both are live. */
  :root {
    --void: #0e1016; --panel: #151a26; --panel2: #1b2133; --border: #28304a;
    --ink: #dbdfe9; --dim: #8b91a7; --faint: #5b6178;
    --signal: #7aa2f7; --go: #9ece6a; --hold: #e0af68; --halt: #f7768e;
    --spike: #bb9af7;
    --sans: system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--void); color: var(--ink); font: 15px/1.55 var(--sans);
         padding: 1.2rem 1.5rem 4rem; max-width: 1180px; margin: 0 auto; }
  a { color: var(--signal); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .topbar { display: flex; align-items: baseline; gap: 1.1rem; flex-wrap: wrap; }
  .topbar h1 { font-size: 1rem; font-weight: 600; letter-spacing: .03em; }
  #conn { font: .72rem var(--mono); color: var(--dim); }
  #conn.live::before { content: "●"; color: var(--go); margin-right: .35rem; }
  #conn.reconnecting::before,
  #conn.offline::before { content: "●"; color: var(--halt); margin-right: .35rem; }

  /* ---------- chip bar: the router ---------- */
  .chiprow { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1.1rem 0 1rem; }
  .chip { display: flex; align-items: baseline; gap: .45rem; background: var(--panel);
          border: 1px solid var(--border); border-radius: 8px; padding: .28rem .7rem; }
  .chip b { font: 600 1.05rem var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .chip span { font-size: .68rem; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
  .chip.attn { border-color: color-mix(in srgb, var(--hold) 55%, transparent); }
  .chip.attn b { color: var(--hold); }
  .chip.wait { border-color: color-mix(in srgb, var(--signal) 45%, transparent); }
  .chip.wait b { color: var(--signal); }
  /* Zero dims rather than vanishing: the outgoing board drops these with a
     ternary, which makes an empty queue look identical to an untracked one. */
  .chip.zero { opacity: .45; }
  .chip.on { background: var(--panel2); border-color: var(--signal); }
  .chip.on span { color: var(--ink); }

  /* ---------- board ---------- */
  .attnline { font: .78rem var(--mono); color: var(--hold); margin: .2rem 0 1rem; }
  .calmline { font: .78rem var(--mono); color: var(--faint); margin: .2rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .8rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: .85rem 1rem; display: flex; flex-direction: column; gap: .6rem;
          color: inherit; }
  .card.attn { border-color: color-mix(in srgb, var(--hold) 55%, transparent); }
  .card.err { border-color: color-mix(in srgb, var(--halt) 55%, transparent); }
  .card.stale { opacity: .82; }
  .head { display: flex; align-items: flex-start; gap: .4rem; flex-wrap: wrap; }
  .ctitle { font-weight: 600; line-height: 1.3; min-width: 0; flex-grow: 1; }
  .errmsg { font: 11px var(--mono); color: var(--halt); overflow-wrap: anywhere; }

  /* max-width + ellipsis is the actual fix for the title-overflow bug that
     helped kill the per-child-cards attempt: a badge can carry unbounded text
     (an epic's real title), and without this a long one forces the title into
     an unreadably narrow column instead of truncating itself. */
  .badge { flex: none; font: 10.5px var(--mono); color: var(--dim);
           border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px;
           white-space: nowrap; max-width: 220px; overflow: hidden;
           text-overflow: ellipsis; }
  .badge.repo { margin-left: auto; }
  .badge.wait { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); }
  .badge.epic { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); font-weight: 600; }
  .badge.spike { color: var(--hold); border-color: color-mix(in srgb, var(--hold) 45%, var(--border)); font-weight: 600; }
  .badge.halt { color: var(--halt); border-color: color-mix(in srgb, var(--halt) 45%, transparent); }

  /* The strongest attention signal on the board is filled, not outlined —
     amber ground with dark ink, both keep-list hexes. */
  .flag { flex: none; font: 600 10.5px var(--mono); color: #14100a; background: var(--hold);
          border-radius: 5px; padding: 3px 7px; white-space: nowrap;
          max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- phase track ---------- */
  .track { display: flex; gap: 3px; }
  .track i { flex-grow: 1; height: 5px; border-radius: 3px; background: var(--panel2); }
  .track i.on { background: color-mix(in srgb, var(--signal) 55%, transparent); }
  .track i.now { background: var(--signal); box-shadow: 0 0 8px color-mix(in srgb, var(--signal) 60%, transparent); }
  .phase-lbl { font: 11px var(--mono); color: var(--signal); margin-top: .25rem; }
  .phase-lbl small { color: var(--faint); }
  .phase-lbl.unknown { color: var(--faint); }

  /* ---------- meters ---------- */
  .meters { display: flex; flex-direction: column; gap: .4rem; }
  .meter .lbl { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--dim); }
  .meter .lbl b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .meter .bar { height: 4px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin-top: 3px; }
  .meter .bar i { display: block; height: 100%; background: var(--go); }
  .pips { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .pips .lbl { font: 10.5px var(--mono); color: var(--dim); margin-right: .25rem; }
  .pip { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--faint);
         display: grid; place-items: center; font: 700 8px var(--mono); }
  .pip.pass { border-color: var(--go); color: var(--go); background: color-mix(in srgb, var(--go) 20%, transparent); }
  .pip.fail { border-color: var(--halt); color: var(--halt); background: color-mix(in srgb, var(--halt) 22%, transparent); }

  /* ---------- epic roster ---------- */
  .roster { display: flex; gap: .3rem; flex-wrap: wrap; }
  .rosterempty { font: 11px var(--mono); color: var(--faint); }
  .childchip { font: 10.5px var(--mono); color: var(--dim); border: 1px solid var(--border);
               border-radius: 5px; padding: 2px 7px; white-space: nowrap;
               max-width: 220px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .childchip.active { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); }
  .childchip.done { color: var(--go); }

  /* ---------- foot ---------- */
  .foot { display: flex; align-items: center; gap: .45rem; font: 11px var(--mono);
          color: var(--dim); border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
          padding-top: .5rem; }
  .foot .sp { margin-left: auto; }
  .foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--go); flex: none; }
  .foot .dot.old { background: var(--faint); }
  .foot .wl { color: var(--faint); max-width: 190px; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .act { background: var(--panel2); border: 1px solid var(--border); color: var(--ink);
         border-radius: 999px; padding: 3px 11px; font: 500 11.5px var(--mono); cursor: pointer; }

  /* ---------- queue panels: needs-you and waiting ----------
     One panel shape for both lenses, laid out on named grid areas so the phone
     re-flows it without a second DOM. The `age` area is drawn even when nothing
     fills it: needs_you entries carry no timestamp until adb-needs-you-since,
     and an unfilled grid area costs nothing. */
  .qlist { display: flex; flex-direction: column; gap: .8rem; }
  .qpanel { background: var(--panel); border-radius: 10px; padding: .9rem 1.05rem;
            display: grid; gap: .3rem .8rem; align-items: center;
            grid-template-columns: auto 1fr auto auto;
            grid-template-areas: "kind what age cta" "detail detail detail detail";
            border: 1px solid color-mix(in srgb, var(--hold) 55%, transparent); }
  /* Amber is the summons. Waiting is a status, not a summons: signal blue on
     the badge, never --hold on the frame, so it cannot compete for the glance. */
  .qpanel.wait { border-color: var(--border); }

  .qkind { grid-area: kind; font: 500 10.5px var(--mono); text-transform: uppercase;
           letter-spacing: .06em; padding: 3px 8px; border-radius: 5px; white-space: nowrap;
           max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .qkind.checkpoint { color: var(--hold); background: color-mix(in srgb, var(--hold) 14%, transparent); }
  .qkind.question { color: var(--signal); background: color-mix(in srgb, var(--signal) 14%, transparent); }
  .qkind.wait { color: var(--signal);
                border: 1px solid color-mix(in srgb, var(--signal) 45%, var(--border)); }

  .qwhat { grid-area: what; min-width: 0; }
  .qtext { display: block; font-weight: 600; line-height: 1.35; }
  .qsub { display: block; color: var(--dim); font-size: .82rem; }
  .qsub a { color: var(--dim); }
  .qsub a:hover { color: var(--signal); }
  .qchild { color: var(--signal); }

  .qage { grid-area: age; justify-self: end; font: 600 10.5px var(--mono); color: var(--dim);
          border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; white-space: nowrap; }

  /* pre-wrap, not plain pre: `detail` is a commit summary or a scout note, so
     its own newlines matter but its long lines are prose. Left as `pre` it
     clips a one-line summary at the panel edge with nothing to show there is
     more — which is what a real browser showed and happy-dom could not. */
  .qdetail { grid-area: detail; background: var(--void); border: 1px solid var(--border);
             border-radius: 8px; padding: .6rem .8rem; margin-top: .4rem; overflow-x: auto;
             white-space: pre-wrap; overflow-wrap: anywhere;
             font: 12px/1.55 var(--mono); color: var(--ink); }

  .qcta { grid-area: cta; display: flex; gap: .5rem; align-items: center; }
  .cta { background: var(--panel2); border: 1px solid var(--border); color: var(--ink);
         border-radius: 999px; padding: 4px 14px; font: 500 11.5px var(--mono);
         cursor: pointer; white-space: nowrap; }
  .cta.go { border-color: var(--go); color: var(--go); }
  /* Drawn but not wired: adb-checkpoint-answer-endpoint. Dimmed rather than
     hidden, so what ships is the layout that endpoint lands into. */
  .cta[disabled] { opacity: .45; cursor: not-allowed; }
  .qlink { font: 500 11.5px var(--mono); white-space: nowrap; }
  .qlink.dead { color: var(--faint); cursor: not-allowed; }
  .act.bad { border-color: var(--halt); color: var(--halt); }

  /* ---------- friction: the global FEEDBACK.md log ----------
     Deliberately uncoloured. A review queue, not something blocking you, so it
     borrows no attention tone at all. */
  .frlist { display: flex; flex-direction: column; gap: .6rem; }
  .frrow { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: .75rem 1rem; display: grid; gap: .3rem .8rem; align-items: center;
           grid-template-columns: auto 1fr auto;
           grid-template-areas: "kind what cta" "detail detail detail" "note note note"; }
  .frsig { grid-area: kind; font: 500 10.5px var(--mono); text-transform: uppercase;
           letter-spacing: .06em; color: var(--dim); border: 1px solid var(--border);
           border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
  .fnote { grid-area: note; font-size: .82rem; color: var(--dim); }
  .sigcounts { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .2rem; }
  .sigcount { font: 10.5px var(--mono); color: var(--dim); border: 1px solid var(--border);
              border-radius: 5px; padding: 2px 8px; }
  .sigcount b { color: var(--ink); }
  .frdone { margin-top: .8rem; display: flex; flex-direction: column; gap: .6rem; }
  .frdone .frrow { opacity: .6; }
  .frdonehead { font: .72rem var(--mono); color: var(--faint); text-transform: uppercase;
                letter-spacing: .1em; padding-top: .6rem;
                border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent); }

  /* ---------- task detail ---------- */
  .crumb { display: inline-block; font: .78rem var(--mono); color: var(--dim); margin-bottom: .9rem; }
  .crumb:hover { color: var(--signal); }
  .hero { display: flex; flex-direction: column; gap: .7rem; margin-bottom: 1.4rem; }
  .hero h1 { font-size: 1.5rem; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
  .metarow { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .heroacts { display: flex; gap: .5rem; }

  /* ---------- epic detail ---------- */
  /* The roster IS the state on an epic page, so the aggregate is a summary
     line, not a meter: an epic has no single progress bar to fill. */
  .agg { font: .78rem var(--mono); color: var(--dim); margin: -.6rem 0 1rem; }
  .agg b { color: var(--ink); font-weight: 600; }

  /* A child's state, on its own detail hero. Blue active, green done, quiet
     pending — the board's existing semantics, not a new palette. */
  .badge.child { text-transform: lowercase; }
  .badge.child.active { color: var(--signal);
                        border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); }
  .badge.child.done { color: var(--go);
                      border-color: color-mix(in srgb, var(--go) 45%, var(--border)); }
  .badge.child.pending { color: var(--faint); }

  /* Not the same as `.unknown`. A pending child has no phase because it has
     not started, which is a normal place to be; `unknown` marks a value off
     the enum, which is a data problem. They must not read alike. */
  .phase-lbl.idle { color: var(--faint); }

  /* The card's track compressed to bare segments for want of room. Detail has
     the room, and the labels are why you came. */
  .stepper { display: grid; grid-template-columns: repeat(var(--steps), 1fr); gap: 4px; }
  .sstep i { display: block; height: 5px; border-radius: 3px; background: var(--panel2); }
  .sstep span { display: block; font: 10.5px var(--mono); color: var(--faint); margin-top: .3rem;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sstep.on i { background: color-mix(in srgb, var(--signal) 55%, transparent); }
  .sstep.now i { background: var(--signal); box-shadow: 0 0 8px color-mix(in srgb, var(--signal) 60%, transparent); }
  .sstep.now span { color: var(--signal); }
  .stepper-note { font: 11px var(--mono); color: var(--faint); margin-top: .3rem; }

  /* ---------- the contract ledger ----------
     Plan and scorecard are task STATE; decisions, code and links are evidence.
     The frame is what says so. */
  .ledger { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; margin-bottom: 1.8rem; }
  .ledgerhead { display: flex; align-items: baseline; gap: .9rem; flex-wrap: wrap;
                padding: .8rem 1.1rem; background: var(--panel2);
                border-bottom: 1px solid var(--border); }
  .ledgerhead .lbl { font: 600 11px var(--mono); text-transform: uppercase;
                     letter-spacing: .13em; color: var(--dim); }
  .ledgerhead .phase { font: 500 11.5px var(--mono); color: var(--signal); border-radius: 999px;
                       border: 1px solid color-mix(in srgb, var(--signal) 40%, transparent);
                       padding: .1rem .55rem; }
  .ledgerhead .inphase { font: 11.5px var(--mono); color: var(--faint); }
  .ratios { margin-left: auto; display: flex; gap: .5rem; flex-wrap: wrap; }
  .ratio { display: flex; align-items: baseline; gap: .4rem; font: 11px var(--mono);
           text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
           background: var(--panel); border: 1px solid var(--border);
           border-radius: 7px; padding: .2rem .55rem; }
  .ratio b { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .ratio.done b { color: var(--go); }
  .ratio.open b { color: var(--hold); }
  /* A failure has to be readable from the header, not only from the row. */
  .ratio.bad { border-color: color-mix(in srgb, var(--halt) 55%, transparent); }
  .ratio.bad b { color: var(--halt); }

  /* `ltrack`, not `track`: the card's phase track already owns `.track` and is
     `display:flex`, which laid the ledger's two columns out as one row. Only a
     real browser showed it — the class names never collide in the DOM tree. */
  .tracks { display: grid; grid-template-columns: 1fr 1fr; }
  .ltrack { padding: 1.1rem 1.2rem 1.3rem; min-width: 0; }
  .ltrack + .ltrack { border-left: 1px solid var(--border); }
  .ltrackhead { display: flex; align-items: baseline; gap: .6rem; margin-bottom: 1rem; }
  .ltrackhead h3 { font: 600 11.5px var(--mono); text-transform: uppercase;
                   letter-spacing: .13em; color: var(--dim); }
  .ltrackhead .hint { font: 11px var(--mono); color: var(--faint); margin-left: auto; }
  .tracknote { font: 11.5px var(--mono); color: var(--faint); }

  /* plan: a connected rail, because the steps are ordered */
  .steps { list-style: none; padding: 0; display: flex; flex-direction: column; }
  .step { position: relative; padding: 0 0 .85rem 1.85rem; }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ""; position: absolute; left: 6px; top: 1.15rem; bottom: -.1rem;
                  width: 1px; background: var(--border); }
  .step:last-child::before { display: none; }
  .step.done::before { background: color-mix(in srgb, var(--go) 45%, var(--border)); }
  .node { position: absolute; left: 0; top: .28rem; width: 13px; height: 13px; border-radius: 50%;
          border: 1.5px solid var(--faint); background: var(--panel);
          display: grid; place-items: center; font: 700 8.5px var(--mono); line-height: 1; }
  .step.done .node { background: var(--go); border-color: var(--go); }
  .step.done .node::after { content: "✓"; color: var(--void); }
  .step.doing .node { border-color: var(--signal);
                      box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 18%, transparent); }
  .step.blocked .node { border-color: var(--hold); background: var(--hold); }
  .step.blocked .node::after { content: "!"; color: var(--void); }
  .step .tx { font-size: 13.5px; color: var(--ink); }
  .step.done .tx { color: var(--dim); }
  .step.doing .tx { font-weight: 500; }
  .step .n { font: 500 10.5px var(--mono); color: var(--faint);
             font-variant-numeric: tabular-nums; margin-right: .5rem; }
  .step .why { display: block; font: 11.5px var(--mono); color: var(--hold); margin-top: .2rem; }

  /* scorecard: independent squares, because criteria are unordered */
  .checks { list-style: none; padding: 0; display: flex; flex-direction: column; gap: .7rem; }
  .check { display: flex; gap: .65rem; align-items: flex-start; }
  .box { flex: none; width: 14px; height: 14px; margin-top: .2rem; border-radius: 3px;
         border: 1.5px solid var(--faint); display: grid; place-items: center;
         font-size: 9px; line-height: 1; font-weight: 700; }
  .check.pass .box { background: color-mix(in srgb, var(--go) 22%, transparent);
                     border-color: var(--go); color: var(--go); }
  .check.pass .box::after { content: "✓"; }
  .check.fail .box { background: color-mix(in srgb, var(--halt) 25%, transparent);
                     border-color: var(--halt); color: var(--halt); }
  .check.fail .box::after { content: "✕"; }
  .check.open .box { border-style: dashed; border-color: var(--hold); }
  .check .body { min-width: 0; }
  .check .n { font: 500 10.5px var(--mono); color: var(--faint);
              font-variant-numeric: tabular-nums; margin-right: .45rem; }
  .check .tx { font-size: 13.5px; color: var(--ink); }
  .check.pass .tx { color: var(--dim); }
  /* A criterion without a visible verification is an opinion. */
  .check .vf { display: block; font: 11.5px var(--mono); color: var(--faint);
               margin-top: .2rem; overflow-wrap: anywhere; }
  .check.fail { margin: 0 -.6rem; padding: .45rem .6rem; border-radius: 6px;
                background: color-mix(in srgb, var(--halt) 9%, transparent);
                box-shadow: inset 2px 0 0 var(--halt); }
  .check.fail .tx { font-weight: 500; }
  .check.fail .vf { color: var(--halt); }
  .check.open .vf { color: var(--hold); }

  /* An empty scorecard above tier 1 means the work has no agreed done. */
  .empty { border: 1px dashed color-mix(in srgb, var(--hold) 45%, var(--border));
           border-radius: 8px; padding: .8rem .9rem;
           background: color-mix(in srgb, var(--hold) 7%, transparent); }
  .empty .t { font-size: 13px; color: var(--hold); }
  .empty .s { display: block; font: 11.5px var(--mono); color: var(--faint); margin-top: .25rem; }

  /* ---------- the record ---------- */
  .record { display: flex; flex-direction: column; gap: 1.4rem; }
  .sec h3 { font: 600 11.5px var(--mono); text-transform: uppercase; letter-spacing: .13em;
            color: var(--dim); margin-bottom: .7rem; }
  .sec h3 .count { color: var(--ink); }
  .sec.warn h3 { color: var(--hold); }
  .tl { display: flex; flex-direction: column; gap: .6rem; }
  .ev { border-left: 2px solid var(--border); padding-left: .8rem; }
  .ev b { font-weight: 600; font-size: 13.5px; }
  .ev small { display: block; font-size: 12.5px; color: var(--dim); }
  .ev .when { font: 11px var(--mono); color: var(--faint); }
  .codeblock { border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem;
               margin-bottom: .5rem; }
  .codeblock .path { font: 11.5px var(--mono); color: var(--signal); }
  .codeblock .lang { font: 10.5px var(--mono); color: var(--faint); margin-left: .5rem; }
  .codeblock .cnote { font-size: 13px; color: var(--dim); margin-top: .25rem; }
  .fold summary { cursor: pointer; font: 11.5px var(--mono); color: var(--dim); }
  .fold pre { background: var(--void); border: 1px solid var(--border); border-radius: 8px;
              padding: .6rem .8rem; margin-top: .5rem; overflow-x: auto;
              font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .notes { margin-top: 1.6rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .mdbody { margin-top: .6rem; }
  .mdbody h3, .mdbody h4, .mdbody h5, .mdbody h6 { margin: 1rem 0 .35rem; font-size: .95rem; }
  .mdbody p { margin: .45rem 0; font-size: 13.5px; color: var(--dim); }
  .mdbody ul { margin: .35rem 0 .35rem 1.1rem; font-size: 13.5px; color: var(--dim); }
  .mdbody code { font: .9em var(--mono); color: var(--ink); }
  .mdbody b { color: var(--ink); }
  .plain { list-style: none; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
  .plain .mk { color: var(--faint); margin-right: .4rem; }
  .plain .dead { color: var(--faint); cursor: not-allowed; }
  .kv { border-collapse: collapse; font-size: 12.5px; }
  .kv td { border: 1px solid var(--border); padding: .3rem .55rem; vertical-align: top; }
  .kv td:first-child { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; }

  /* ---------- phone: the chip bar is the nav ---------- */
  @media (max-width: 640px) {
    body { padding: .9rem .9rem 3rem; }
    .chiprow {
      position: sticky; top: 0; z-index: 5;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      background: var(--void); padding: .6rem 0; margin: .6rem 0;
    }
    .chiprow::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: 44px; align-items: center; padding: .4rem .8rem; }
    .grid { grid-template-columns: 1fr; }

    /* The panel stacks: badge and age share the top line, then the text, then
       the detail, then full-width thumb targets. Same DOM, different areas. */
    .qpanel {
      grid-template-columns: auto 1fr;
      grid-template-areas: "kind age" "what what" "detail detail" "cta cta";
      align-items: start;
    }
    .frrow {
      grid-template-columns: auto 1fr;
      grid-template-areas: "kind cta" "what what" "detail detail" "note note";
      align-items: start;
    }
    .qcta { margin-top: .5rem; }
    /* 44px minimum, and each control takes its share of the width rather than
       hugging a corner. */
    .qpanel .cta { flex: 1 1 0; min-height: 44px; display: grid; place-items: center;
                   border-radius: 10px; font-size: 13px; }
    .frrow .qcta { margin-top: 0; justify-self: end; }

    /* The ledger's tracks stack, and the SCORECARD goes first: on a phone you
       are checking whether something needs you, not reading a work breakdown.
       Source order is plan-then-scorecard, so the order lives here. */
    .tracks { grid-template-columns: 1fr; }
    .ltrack + .ltrack { border-left: 0; border-top: 1px solid var(--border); }
    .ltrack.score { order: 1; border-top: 0; }
    .ltrack.plan { order: 2; border-top: 1px solid var(--border); }
    .hero h1 { font-size: 1.25rem; }
    /* Ten phase labels do not fit in 390px — they collide and the last one
       clips. The segments still show progress, and the phase itself is named
       twice below: in the hero's chips and in the ledger header. */
    .stepper { gap: 3px; }
    .sstep span { display: none; }
  }
</style>
