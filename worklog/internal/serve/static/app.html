<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devboard · next</title>

<!-- The import map is load-bearing, not a convenience: the vendored
     hooks.module.js itself opens with a bare `import ... from "preact"`,
     so without this it cannot resolve. Vendor filenames and these
     specifiers move together. Application modules under /assets/src/
     import each other relatively and add no bare specifiers. -->
<script type="importmap">
{
  "imports": {
    "preact": "/assets/vendor/preact.module.js",
    "preact/hooks": "/assets/vendor/hooks.module.js",
    "htm": "/assets/vendor/htm.module.js"
  }
}
</script>

<style>
  /* Tokens are copied from index.html deliberately: adb-lens-cutover owns
     unifying them, and duplicating a dozen custom properties beats coupling
     this page to the outgoing board's stylesheet while both are live. */
  :root {
    --void: #0e1016; --panel: #151a26; --panel2: #1b2133; --border: #28304a;
    --ink: #dbdfe9; --dim: #8b91a7; --faint: #5b6178;
    --signal: #7aa2f7; --go: #9ece6a; --hold: #e0af68; --halt: #f7768e;
    --spike: #bb9af7;
    --sans: system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--void); color: var(--ink); font: 15px/1.55 var(--sans);
         padding: 1.2rem 1.5rem 4rem; max-width: 1180px; margin: 0 auto; }
  a { color: var(--signal); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .topbar { display: flex; align-items: baseline; gap: 1.1rem; flex-wrap: wrap; }
  .topbar h1 { font-size: 1rem; font-weight: 600; letter-spacing: .03em; }
  #conn { font: .72rem var(--mono); color: var(--dim); }
  #conn.live::before { content: "●"; color: var(--go); margin-right: .35rem; }
  #conn.reconnecting::before,
  #conn.offline::before { content: "●"; color: var(--halt); margin-right: .35rem; }

  /* ---------- chip bar: the router ---------- */
  .chiprow { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1.1rem 0 1rem; }
  .chip { display: flex; align-items: baseline; gap: .45rem; background: var(--panel);
          border: 1px solid var(--border); border-radius: 8px; padding: .28rem .7rem; }
  .chip b { font: 600 1.05rem var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  .chip span { font-size: .68rem; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
  .chip.attn { border-color: color-mix(in srgb, var(--hold) 55%, transparent); }
  .chip.attn b { color: var(--hold); }
  .chip.wait { border-color: color-mix(in srgb, var(--signal) 45%, transparent); }
  .chip.wait b { color: var(--signal); }
  /* Zero dims rather than vanishing: the outgoing board drops these with a
     ternary, which makes an empty queue look identical to an untracked one. */
  .chip.zero { opacity: .45; }
  .chip.on { background: var(--panel2); border-color: var(--signal); }
  .chip.on span { color: var(--ink); }

  /* ---------- board ---------- */
  .attnline { font: .78rem var(--mono); color: var(--hold); margin: .2rem 0 1rem; }
  .calmline { font: .78rem var(--mono); color: var(--faint); margin: .2rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .8rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: .85rem 1rem; display: flex; flex-direction: column; gap: .6rem;
          color: inherit; }
  .card.attn { border-color: color-mix(in srgb, var(--hold) 55%, transparent); }
  .card.err { border-color: color-mix(in srgb, var(--halt) 55%, transparent); }
  .card.stale { opacity: .82; }
  .head { display: flex; align-items: flex-start; gap: .4rem; flex-wrap: wrap; }
  .ctitle { font-weight: 600; line-height: 1.3; min-width: 0; flex-grow: 1; }
  .errmsg { font: 11px var(--mono); color: var(--halt); overflow-wrap: anywhere; }

  /* max-width + ellipsis is the actual fix for the title-overflow bug that
     helped kill the per-child-cards attempt: a badge can carry unbounded text
     (an epic's real title), and without this a long one forces the title into
     an unreadably narrow column instead of truncating itself. */
  .badge { flex: none; font: 10.5px var(--mono); color: var(--dim);
           border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px;
           white-space: nowrap; max-width: 220px; overflow: hidden;
           text-overflow: ellipsis; }
  .badge.repo { margin-left: auto; }
  .badge.wait { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); }
  .badge.epic { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); font-weight: 600; }
  .badge.spike { color: var(--hold); border-color: color-mix(in srgb, var(--hold) 45%, var(--border)); font-weight: 600; }
  .badge.halt { color: var(--halt); border-color: color-mix(in srgb, var(--halt) 45%, transparent); }

  /* The strongest attention signal on the board is filled, not outlined —
     amber ground with dark ink, both keep-list hexes. */
  .flag { flex: none; font: 600 10.5px var(--mono); color: #14100a; background: var(--hold);
          border-radius: 5px; padding: 3px 7px; white-space: nowrap;
          max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- phase track ---------- */
  .track { display: flex; gap: 3px; }
  .track i { flex-grow: 1; height: 5px; border-radius: 3px; background: var(--panel2); }
  .track i.on { background: color-mix(in srgb, var(--signal) 55%, transparent); }
  .track i.now { background: var(--signal); box-shadow: 0 0 8px color-mix(in srgb, var(--signal) 60%, transparent); }
  .phase-lbl { font: 11px var(--mono); color: var(--signal); margin-top: .25rem; }
  .phase-lbl small { color: var(--faint); }
  .phase-lbl.unknown { color: var(--faint); }

  /* ---------- meters ---------- */
  .meters { display: flex; flex-direction: column; gap: .4rem; }
  .meter .lbl { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--dim); }
  .meter .lbl b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .meter .bar { height: 4px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin-top: 3px; }
  .meter .bar i { display: block; height: 100%; background: var(--go); }
  .pips { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .pips .lbl { font: 10.5px var(--mono); color: var(--dim); margin-right: .25rem; }
  .pip { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--faint);
         display: grid; place-items: center; font: 700 8px var(--mono); }
  .pip.pass { border-color: var(--go); color: var(--go); background: color-mix(in srgb, var(--go) 20%, transparent); }
  .pip.fail { border-color: var(--halt); color: var(--halt); background: color-mix(in srgb, var(--halt) 22%, transparent); }

  /* ---------- epic roster ---------- */
  .roster { display: flex; gap: .3rem; flex-wrap: wrap; }
  .rosterempty { font: 11px var(--mono); color: var(--faint); }
  .childchip { font: 10.5px var(--mono); color: var(--dim); border: 1px solid var(--border);
               border-radius: 5px; padding: 2px 7px; white-space: nowrap;
               max-width: 220px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .childchip.active { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 45%, var(--border)); }
  .childchip.done { color: var(--go); }

  /* ---------- foot ---------- */
  .foot { display: flex; align-items: center; gap: .45rem; font: 11px var(--mono);
          color: var(--dim); border-top: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
          padding-top: .5rem; }
  .foot .sp { margin-left: auto; }
  .foot .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--go); flex: none; }
  .foot .dot.old { background: var(--faint); }
  .foot .wl { color: var(--faint); max-width: 190px; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .act { background: var(--panel2); border: 1px solid var(--border); color: var(--ink);
         border-radius: 999px; padding: 3px 11px; font: 500 11.5px var(--mono); cursor: pointer; }

  /* ---------- phone: the chip bar is the nav ---------- */
  @media (max-width: 640px) {
    body { padding: .9rem .9rem 3rem; }
    .chiprow {
      position: sticky; top: 0; z-index: 5;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      background: var(--void); padding: .6rem 0; margin: .6rem 0;
    }
    .chiprow::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: 44px; align-items: center; padding: .4rem .8rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
  import { h, render } from 'preact'
  import htm from 'htm'
  import { App, defaultTransport } from '/assets/src/app.js'

  const html = htm.bind(h)
  render(html`<${App} transport=${defaultTransport()} />`, document.getElementById('app'))
</script>

</body>
</html>
